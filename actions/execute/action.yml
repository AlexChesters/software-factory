name: "Alex's Software Factory- Execute"
description: Execute a change

inputs:
  github-token:
    description: Installation token from the GitHub App that posted the plan, used to read the plan and create a pull request
    required: true
  allowed-bash-commands:
    description: Optional newline-separated bash commands Claude may run, for example npm test. Each line becomes a Bash(<command>) allow rule.
    required: false
    default: ""
  model:
    description: Explicit Claude model to use. When set, TypeSafe is not used and no TypeSafe API key is needed.
    required: false
    default: ""
  effort:
    description: Effort level. Requires model; defaults to medium when a model is set.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install python
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH/../../factory"
        uv python install
    - name: Fetch the approved plan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        if ! bot_id=$(gh api graphql -f query='query { viewer { databaseId } }' \
          | jq -er '.data.viewer.databaseId | numbers'); then
          echo "::error::Could not determine the GitHub App bot ID."
          exit 1
        fi
        cd "$GITHUB_ACTION_PATH/../../factory"
        if ! gh api --paginate --slurp "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
          | jq -er --argjson bot_id "$bot_id" '
              [.[][]
                | select(.user.type == "Bot" and .user.id == $bot_id)
                | select((.body // "") | startswith("## Proposed plan\n"))]
              | max_by(.created_at) | .body
            ' > plan.md; then
          echo "::error::Could not fetch a plan comment from the Factory App."
          exit 1
        fi
    - name: Prepare prompt
      shell: bash
      env:
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
      run: |
        cd "$GITHUB_ACTION_PATH/../../factory"
        printf 'The task (issue #%s):\nTitle: %s\n\n%s\n\nThe approved plan:\n' "$ISSUE_NUMBER" "$ISSUE_TITLE" "$ISSUE_BODY" > task.md
        cat plan.md >> task.md
    - name: Mint GitHub OIDC token
      id: oidc
      shell: bash
      run: |
        token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
          | jq -er .value)
        printf '::add-mask::%s\n' "$token"
        printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"
    - name: Run Claude
      shell: bash
      env:
        ANTHROPIC_IDENTITY_TOKEN: ${{ steps.oidc.outputs.token }}
        MODEL: ${{ inputs.model }}
        EFFORT: ${{ inputs.effort }}
        ALLOWED_BASH_COMMANDS: ${{ inputs.allowed-bash-commands }}
      run: |
        cd "$GITHUB_ACTION_PATH/../../factory"
        args=()
        if [ -n "$MODEL" ]; then args+=(--model "$MODEL"); fi
        if [ -n "$EFFORT" ]; then args+=(--effort "$EFFORT"); fi
        while IFS= read -r cmd; do
          cmd="${cmd#"${cmd%%[![:space:]]*}"}"; cmd="${cmd%"${cmd##*[![:space:]]}"}"
          [ -n "$cmd" ] && args+=(--allowed-bash-command "$cmd")
        done <<< "$ALLOWED_BASH_COMMANDS"
        uv run python -m software_factory.main --mode execute --repo-dir "$GITHUB_WORKSPACE" "${args[@]}" < task.md
    - name: Open a pull request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
      run: |
        N="${{ github.event.issue.number }}"
        git config user.name "factory-bot"
        git config user.email "factory-bot@users.noreply.github.com"
        git checkout -b "factory/issue-$N"
        git add -- . ':!task.md' ':!plan.md' ':!factory/'
        git commit -m "Factory: $ISSUE_TITLE (#$N)"
        gh auth setup-git
        git push origin "factory/issue-$N"
        gh pr create \
          --title "Factory: $ISSUE_TITLE" \
          --body "Closes #$N. Built by the execution station from the approved plan." \
          --head "factory/issue-$N"
