name: "Alex's Software Factory- Execute"
description: Execute a change

inputs:
  github-token:
    description: GitHub token used to read the plan and create a pull request
    required: true
  github-app-client-id:
    description: Client ID of the GitHub app used to issue the OIDC token, used to validate the plan was generated by this app
  anthropic-token:
    description: Anthropic identity token obtained from WIF, used to call the Claude API
    required: true

# TODO: find a way to run tests after changes
# maybe a test command passed in?

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install python
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH/../../factory"
        uv python install
    # Find comments with the plan heading from the configured Factory App.
    # If several match, use the most recently posted one.
    - name: Fetch the approved plan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        APP_CLIENT_ID: ${{ inputs.github-app-client-id }}
      run: |
        cd "$GITHUB_ACTION_PATH/../../factory"
        if ! gh api --paginate --slurp "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
          | jq -er --arg app_client_id "$APP_CLIENT_ID" '
              [.[][]
                | select(.performed_via_github_app.client_id == $app_client_id)
                | select((.body // "") | startswith("## Proposed plan\n"))]
              | max_by(.created_at) | .body
            ' > plan.md; then
          echo "::error::Could not fetch a plan comment from the Factory App."
          exit 1
        fi
    - name: Prepare prompt
      shell: bash
      env:
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
      run: |
        cd "$GITHUB_ACTION_PATH/../../factory"
        printf 'The task (issue #%s):\nTitle: %s\n\n%s\n\nThe approved plan:\n' "$ISSUE_NUMBER" "$ISSUE_TITLE" "$ISSUE_BODY" > task.md
        cat plan.md >> task.md
    - name: Run Claude
      shell: bash
      env:
        ANTHROPIC_IDENTITY_TOKEN: ${{ inputs.anthropic-token }}
      run: |
        cd "$GITHUB_ACTION_PATH/../../factory"
        uv run python -m software_factory.main --mode execute --repo-dir "$GITHUB_WORKSPACE" < task.md
    - name: Open a pull request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
      run: |
        N="${{ github.event.issue.number }}"
        git config user.name "factory-bot"
        git config user.email "factory-bot@users.noreply.github.com"
        git checkout -b "factory/issue-$N"
        git add -- . ':!task.md' ':!plan.md' ':!factory/'
        git commit -m "Factory: $ISSUE_TITLE (#$N)"
        gh auth setup-git
        git push origin "factory/issue-$N"
        gh pr create \
          --title "Factory: $ISSUE_TITLE" \
          --body "Closes #$N. Built by the execution station from the approved plan." \
          --head "factory/issue-$N"
