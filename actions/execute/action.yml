name: "Alex's Software Factory- Execute"
description: Execute a change

inputs:
  github-token:
    description: GitHub token used to read the plan and create a pull request
    required: true

# TODO: find a way to run tests after changes
# maybe a test command passed in?

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install python
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH/../../factory"
        uv python install
    - name: Determine current user ID
      id: determine-current-user-id
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        USER_ID=$(gh api graphql -f query='query { viewer { login databaseId } }' --jq '.data.viewer.databaseId')
        echo "USER_ID=$USER_ID" >> $GITHUB_OUTPUT
        echo "[DEBUG] - USER_ID = $USER_ID"
    # Find comments made by the current user with the expected plan heading.
    # If several match, use the most recently posted one.
    - name: Fetch the approved plan
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        APP_CLIENT_ID: ${{ steps.determine-current-user-id.outputs.user_id }}
      run: |
        echo "[DEBUG] - checking $APP_CLIENT_ID"
        cd "$GITHUB_ACTION_PATH/../../factory"
        if ! gh api --paginate --slurp "repos/${{ github.repository }}/issues/${{ github.event.issue.number }}/comments" \
          | jq -er --arg app_client_id "$APP_CLIENT_ID" '
              [.[][]
                | select(.performed_via_github_app.client_id == $app_client_id)
                | select((.body // "") | startswith("## Proposed plan\n"))]
              | max_by(.created_at) | .body
            ' > plan.md; then
          echo "::error::Could not fetch a plan comment from the Factory App."
          exit 1
        fi
    - name: Prepare prompt
      shell: bash
      env:
        ISSUE_NUMBER: ${{ github.event.issue.number }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
      run: |
        cd "$GITHUB_ACTION_PATH/../../factory"
        printf 'The task (issue #%s):\nTitle: %s\n\n%s\n\nThe approved plan:\n' "$ISSUE_NUMBER" "$ISSUE_TITLE" "$ISSUE_BODY" > task.md
        cat plan.md >> task.md
    - name: Mint GitHub OIDC token
      id: oidc
      shell: bash
      run: |
        token=$(curl -fsS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
          "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
          | jq -er .value)
        printf '::add-mask::%s\n' "$token"
        printf 'token=%s\n' "$token" >> "$GITHUB_OUTPUT"
    - name: Run Claude
      shell: bash
      env:
        ANTHROPIC_IDENTITY_TOKEN: ${{ steps.oidc.outputs.token }}
      run: |
        cd "$GITHUB_ACTION_PATH/../../factory"
        uv run python -m software_factory.main --mode execute --repo-dir "$GITHUB_WORKSPACE" < task.md
    - name: Open a pull request
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        ISSUE_TITLE: ${{ github.event.issue.title }}
      run: |
        N="${{ github.event.issue.number }}"
        git config user.name "factory-bot"
        git config user.email "factory-bot@users.noreply.github.com"
        git checkout -b "factory/issue-$N"
        git add -- . ':!task.md' ':!plan.md' ':!factory/'
        git commit -m "Factory: $ISSUE_TITLE (#$N)"
        gh auth setup-git
        git push origin "factory/issue-$N"
        gh pr create \
          --title "Factory: $ISSUE_TITLE" \
          --body "Closes #$N. Built by the execution station from the approved plan." \
          --head "factory/issue-$N"
