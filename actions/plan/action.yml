name: "Alex's Software Factory- Plan"
description: Plan a change

inputs:
  github-token:
    description: GitHub token used to write the plan to the issue
    required: true
  anthropic-token:
    description: Anthropic identity token obtained from WIF, used to call the Claude API
    required: true

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
    - name: Install python
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH/../../factory"
        uv python install
    - name: Prepare prompt
      shell: bash
      env:
        ISSUE_TITLE: ${{ github.event.issue.title }}
        ISSUE_BODY: ${{ github.event.issue.body }}
      run: |
        cd "$GITHUB_ACTION_PATH/../../factory"
        printf 'Title: %s\n\n%s\n' "$ISSUE_TITLE" "$ISSUE_BODY" > task.md
    - name: Run Claude
      shell: bash
      env:
        ANTHROPIC_IDENTITY_TOKEN: ${{ inputs.anthropic-token }}
      run: |
        cd "$GITHUB_ACTION_PATH/../../factory"
        uv run python -m software_factory.main --mode plan --repo-dir "$GITHUB_WORKSPACE" < task.md
    - name: Post review
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        cd "$GITHUB_ACTION_PATH/../../factory"
        {
          echo "## Proposed plan"
          echo
          cat outputs/output.md
          echo
          echo "---"
          echo "Comment \`/approve\` to send this plan to the execution station."
        } > comment.md
        gh issue comment "${{ github.event.issue.number }}" --repo "${{ github.repository }}" --body-file comment.md
