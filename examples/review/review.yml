name: "Factory: review"

on:
  pull_request:
    types: [synchronize, labeled]

permissions:
  id-token: write
  contents: read
  pull-requests: write

defaults:
  run:
    shell: bash

jobs:
  review:
    if: >-
      contains(github.event.pull_request.labels.*.name, 'factory:review') &&
      (github.event.action != 'labeled' || github.event.label.name == 'factory:review')
    runs-on: ubuntu-26.04
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      ANTHROPIC_FEDERATION_RULE_ID: ${{ secrets.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ secrets.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ secrets.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      # Only needed when `model` is not set
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Mint publishing token
        id: factory-app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ secrets.SOFTWARE_FACTORY_APP_CLIENT_ID }}
          private-key: ${{ secrets.SOFTWARE_FACTORY_APP_PRIVATE_KEY }}
          permission-pull-requests: write
      - name: Review PR
        uses: AlexChesters/software-factory/actions/review@main
        with:
          github-token: ${{ steps.factory-app.outputs.token }}
          # model: claude-sonnet-5-5
          # effort: medium # requires model, defaults to medium
